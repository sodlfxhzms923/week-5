
name: Weekly Summary

on:
  schedule:
    - cron: "13 0 * * 1"
  workflow_dispatch:

permissions:
  issues: read
  pull-requests: read

jobs:
  weekly-summary:
    runs-on: ubuntu-latest

    steps:
      - name: Generate weekly report
        uses: actions/github-script@v9
        with:
          script: |
            const { owner, repo } = context.repo;
            const since = Date.now() - 7 * 24 * 60 * 60 * 1000;

            const recent = date =>
              date && new Date(date).getTime() >= since;

            const allItems = await github.paginate(
              github.rest.issues.listForRepo,
              { owner, repo, state: "all", per_page: 100 }
            );

            const issues = allItems.filter(
              item => !item.pull_request
            );

            const prs = await github.paginate(
              github.rest.pulls.list,
              { owner, repo, state: "all", per_page: 100 }
            );

            const issueOpened = issues.filter(
              i => recent(i.created_at)
            ).length;

            const issueClosed = issues.filter(
              i => recent(i.closed_at)
            ).length;

            const prOpened = prs.filter(
              p => recent(p.created_at)
            ).length;

            const prMerged = prs.filter(
              p => recent(p.merged_at)
            ).length;

            const report = [
              "# Weekly Project Summary",
              "",
              "Period: Last 7 days",
              "",
              `- New Issues: ${issueOpened}`,
              `- Closed Issues: ${issueClosed}`,
              `- New Pull Requests: ${prOpened}`,
              `- Merged Pull Requests: ${prMerged}`,
              "",
              "Generated by GitHub Actions."
            ].join("\n");

            await core.summary.addRaw(report).write();
            console.log(report);
